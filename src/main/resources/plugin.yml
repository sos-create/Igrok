name: Igrok
version: 0.9.0
main: ru.soscreate.igrok.IgrokPlugin
api-version: '1.21'
load: POSTWORLD
authors: [sos-create]
description: Autonomous Paper agent with a lightweight multi-layer cognitive network, adaptive dialogue and learned player behavior.
commands:
  igrok:
    description: Manage the Igrok player agent.
    usage: /igrok <spawn|remove|status|build|cancelbuild|brain|follow|mine|attack|explore|stop>
    permission: igrok.admin
permissions:
  igrok.admin:
    description: Allows managing the Igrok agent.
    default: op
  igrok.build:
    description: Allows asking Igrok to build a house in chat.
    default: op
  igrok.control:
    description: Allows issuing movement, mining and combat requests in chat.
    default: op
