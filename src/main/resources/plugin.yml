name: Igrok
version: 0.9.51
main: ru.soscreate.igrok.IgrokPlugin
api-version: '1.21'
load: POSTWORLD
authors: [sos-create]
description: Independent Paper survival player with autonomous goals, contextual dialogue, persistent relationships, crafting, building, combat and exploration.

permissions:
  igrok.control:
    description: Allows a player to request Igrok's normal actions.
    default: op
  igrok.build:
    description: Allows a player to request Igrok to build.
    default: op
