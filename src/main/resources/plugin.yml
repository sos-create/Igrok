name: Igrok
version: 0.1.0
main: ru.soscreate.igrok.IgrokPlugin
api-version: '1.21'
load: POSTWORLD
authors: [sos-create]
description: Server-side fake player with scripted Russian chat dialogue.
commands:
  igrok:
    description: Manage the Igrok fake player.
    usage: /igrok <spawn|remove|status>
    permission: igrok.admin
permissions:
  igrok.admin:
    description: Allows managing the Igrok fake player.
    default: op
