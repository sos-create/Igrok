# Igrok 0.9.14 configuration
# Optional Mojang account name whose signed player skin Igrok should use.
# Leave empty to use the standard Steve/Alex fallback skin.
skin-owner: ""
bot-name: Igrok
spawn-world: ""
auto-spawn: true
auto-respawn: true

chat:
  enabled: true
  cooldown-seconds: 20
  listen-radius: 12
  # Bot answers 20-30 seconds after the last message in a burst.
  reply-delay-min-seconds: 20
  reply-delay-max-seconds: 30
  # Igrok answers direct mentions and short follow-ups in a recent conversation.
  follow-up-window-seconds: 120
  social:
    enabled: true
    radius: 7
    scan-interval-ticks: 20
    greeting-cooldown-seconds: 300

building:
  enabled: true
  block-interval-ticks: 4
  search-radius: 10
  chat-trigger: true

brain:
  enabled: true
  think-interval-ticks: 20
  exploration:
    enabled: true
  idle-wander:
    enabled: true
  combat:
    aggressive: false
    radius: 12
  mining:
    search-radius: 8
    break-ticks: 28
    blocks-per-order: 4
    # Automatic priorities: survival > iron upgrades > wood/stone/coal > exploration.

autonomy:
  # Player requests are proposals, never guaranteed orders.
  refuse-all-player-orders: false
  # TNT and ignition blocks are hard-banned in code, not configurable.
