# Igrok 0.9.10 configuration
bot-name: Igrok
spawn-world: ""
auto-spawn: true
auto-respawn: true

chat:
  enabled: true
  cooldown-seconds: 2
  listen-radius: 12
  # Igrok answers direct mentions and short follow-ups in a recent conversation.
  follow-up-window-seconds: 120
  social:
    enabled: true
    radius: 7
    scan-interval-ticks: 20
    greeting-cooldown-seconds: 300

building:
  enabled: true
  block-interval-ticks: 2
  search-radius: 16
  chat-trigger: true

brain:
  enabled: true
  think-interval-ticks: 10
  exploration:
    enabled: true
  idle-wander:
    enabled: true
  combat:
    aggressive: false
    radius: 12
  mining:
    search-radius: 10
    break-ticks: 28
    blocks-per-order: 4
    # Automatic priorities: survival > iron upgrades > wood/stone/coal > exploration.

autonomy:
  # Player requests are proposals, never guaranteed orders.
  refuse-all-player-orders: false
  # TNT and ignition blocks are hard-banned in code, not configurable.
