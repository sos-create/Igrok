# Igrok 0.3.0 configuration
bot-name: Igrok
spawn-world: ""
auto-spawn: true
auto-respawn: true
chat:
  enabled: true
  cooldown-seconds: 3

building:
  enabled: true
  block-interval-ticks: 2
  search-radius: 16
  chat-trigger: true

brain:
  enabled: true
  # World perception and goal selection are recalculated at this interval.
  think-interval-ticks: 10
  exploration:
    enabled: true
  combat:
    # Automatically defend only when monsters approach or target the bot.
    aggressive: false
    radius: 12
  mining:
    search-radius: 10
    break-ticks: 28
    blocks-per-order: 4
