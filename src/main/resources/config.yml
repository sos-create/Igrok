# Igrok 0.9.37 configuration
# Optional Mojang account name whose signed player skin Igrok should use.
# Leave empty to use the standard Steve/Alex fallback skin.
skin-owner: ""
bot-name: Igrok
spawn-world: ""
auto-spawn: true
auto-respawn: true

chat:
  enabled: true
  cooldown-seconds: 5
  listen-radius: 16
  # Bot answers five seconds after the last addressed or nearby message.
  reply-delay-min-seconds: 5
  reply-delay-max-seconds: 5
  # Igrok answers direct mentions and short follow-ups in a recent conversation.
  follow-up-window-seconds: 120
  social:
    enabled: true
    radius: 7
    scan-interval-ticks: 20
    greeting-cooldown-seconds: 300

building:
  enabled: true
  block-interval-ticks: 4
  search-radius: 16
  chat-trigger: true

brain:
  enabled: true
  think-interval-ticks: 20
  exploration:
    enabled: true
  idle-wander:
    enabled: true
  combat:
    aggressive: false
    radius: 12
  mining:
    search-radius: 10
    break-ticks: 28
    blocks-per-order: 4
    # Automatic priorities: survival > iron upgrades > wood/stone/coal > exploration.

autonomy:
  # Player requests are proposals, never guaranteed orders.
  refuse-all-player-orders: false
  # TNT and ignition blocks are hard-banned in code, not configurable.

# Igrok chunk streaming. Keeps nearby terrain available without loading a
# complete 17x17 square at once.
chunks:
  enabled: false
  view-radius: 8
  active-radius: 1
  scout-cache: 24
  max-async-loads: 2
