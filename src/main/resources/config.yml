# Igrok 0.5.0 configuration
bot-name: Igrok
spawn-world: ""
auto-spawn: true
auto-respawn: true

chat:
  enabled: true
  cooldown-seconds: 3
  listen-radius: 10
  # Bot reacts only when directly addressed; ambient player chat is ignored.
  social:
    enabled: true
    radius: 7
    scan-interval-ticks: 20
    greeting-cooldown-seconds: 300

building:
  enabled: true
  block-interval-ticks: 2
  search-radius: 16
  chat-trigger: true

brain:
  enabled: true
  think-interval-ticks: 10
  exploration:
    enabled: true
  combat:
    aggressive: false
    radius: 12
  mining:
    search-radius: 10
    break-ticks: 28
    blocks-per-order: 4

autonomy:
  # Player requests are proposals, never guaranteed orders.
  refuse-all-player-orders: false
  # TNT and ignition blocks are hard-banned in code, not configurable.
