# Igrok 0.9.48 configuration
# Optional Mojang account name whose signed player skin Igrok should use.
# Leave empty to use the standard Steve/Alex fallback skin.
skin-owner: ""
bot-name: Igrok
spawn-world: ""
auto-spawn: true
auto-respawn: true

life:
  rain-shelter:
    enabled: true
    search-radius: 8
    scan-interval-ticks: 100

chat:
  enabled: true
  cooldown-seconds: 5
  listen-radius: 16
  ordinary-chat:
    enabled: true
    # A conversation remains open for this long after either side speaks.
    session-seconds: 180
  # Bot answers five seconds after the last addressed or nearby message.
  reply-delay-min-seconds: 5
  reply-delay-max-seconds: 5
  # Direct mentions work at any nearby-player count; solo nearby chat can start a conversation.\n  # Follow-up messages continue naturally during the ordinary-chat session.
  follow-up-window-seconds: 120
  social:
    enabled: true
    radius: 7
    scan-interval-ticks: 20
    greeting-cooldown-seconds: 300
    ambient-enabled: true
    ambient-cooldown-seconds: 150
    initiative-cooldown-seconds: 360

building:
  enabled: true
  block-interval-ticks: 4
  search-radius: 16
  chat-trigger: true

brain:
  enabled: true
  think-interval-ticks: 20
  exploration:
    enabled: true
  idle-wander:
    enabled: true
  combat:
    aggressive: false
    radius: 12
  mining:
    search-radius: 10
    scan-interval-ticks: 20
    break-ticks: 28
    blocks-per-order: 4
    prospecting:
      enabled: true
      max-tunnels-per-order: 3
      max-blocks-per-order: 24
      max-steps-per-tunnel: 8
    # Automatic priorities: survival > iron upgrades > wood/stone/coal > exploration.

autonomy:
  # Player requests are proposals, never guaranteed orders.
  refuse-all-player-orders: false
  # TNT and ignition blocks are hard-banned in code, not configurable.

# Igrok chunk streaming. Keeps nearby terrain available without loading a
# complete 17x17 square at once.
chunks:
  enabled: false
  view-radius: 8
  active-radius: 1
  scout-cache: 24
  max-async-loads: 2
