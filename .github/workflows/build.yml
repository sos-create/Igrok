name: Build Igrok

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: gradle clean build
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Igrok-Paper-1.21.4
          path: build/libs/Igrok-*.jar
          if-no-files-found: error
